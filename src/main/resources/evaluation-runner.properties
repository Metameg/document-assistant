# Paths are resolved from the directory where Spring Boot is launched.
# Set project-root to an absolute path if launching from another directory.
document-assistant.evaluation.project-root=.
# Point this to your Python virtual environment when applicable.
document-assistant.evaluation.python-executable=python
# Must address this Spring application from the Python process.
document-assistant.evaluation.application-url=http://localhost:8080
# Default evidence limits; users can edit the list on the Evaluation screen.
document-assistant.evaluation.k-values=5,10,20,30,40
document-assistant.evaluation.judge-model=openai/gpt-oss-120b
document-assistant.evaluation.process-timeout-seconds=21600

# Rough demo estimate for GPT-oss-120b, per answer AND per judge call.
# OpenRouter headline rates checked 2026-10-01; no runtime pricing lookup.
document-assistant.evaluation.estimate.input-tokens=25
document-assistant.evaluation.estimate.output-tokens=100
document-assistant.evaluation.estimate.input-usd-per-million=0.03
document-assistant.evaluation.estimate.output-usd-per-million=0.17
# UI time estimate is fixed at 10 minutes per distinct k value.
