spring.application.name=document-assistant

server.address=127.0.0.1
server.port=8080

# Local PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/document_assistant
spring.datasource.username=rag

# OpenRouter through Spring AI 2.0.x
spring.ai.openai.base-url=https://openrouter.ai/api/v1

spring.ai.openai.chat.model=openai/gpt-4o-mini
spring.ai.openai.embedding.model=openai/text-embedding-3-small
spring.ai.openai.embedding.encoding-format=float
spring.ai.openai.embedding.dimensions=1536

# Local health check
management.endpoints.web.exposure.include=health
