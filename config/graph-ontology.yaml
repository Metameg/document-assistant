source_text_only:
  description: Preserve and retrieve these topics from source chunks without numeric graph ranking.
  topics:
    - LP consumption columns mixing liquid and gas volumes with unspecified gallon definitions.
    - Warranty scope and duration, certifications, standards, and jurisdictional restrictions.
    - Conditional accessory compatibility and alternative battery requirements.
    - Fault-current ratings with missing units, wire-size ranges, and ambiguous exercise schedules.
    - UPC rows with unsuffixed model names, conflicting overall dimensions, and transfer-switch drawing symbols.
