# Nonsecret demo configuration. Secrets are supplied by Railway Variables.
server.address=0.0.0.0
server.port=${PORT:8080}
document-assistant.evaluation.application-url=http://localhost:${PORT:8080}
document-assistant.evaluation.python-executable=/opt/venv/bin/python
document-assistant.corpora.python-executable=/opt/venv/bin/python
document-assistant.corpora.storage-provider=r2
document-assistant.corpora.storage-directory=/app/data/corpora
document-assistant.corpora.r2.endpoint=${R2_ENDPOINT}
document-assistant.corpora.r2.bucket=${R2_BUCKET}
document-assistant.corpora.r2.access-key-id=${R2_ACCESS_KEY_ID}
document-assistant.corpora.r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
document-assistant.corpora.r2.prefix=${R2_PREFIX:document-assistant-production}
# Public Railway URL by default. Cloudflare Access is an optional future setup.
document-assistant.access.enabled=${APP_ACCESS_ENABLED:false}
document-assistant.access.team-domain=${CF_ACCESS_TEAM_DOMAIN:}
document-assistant.access.audience=${CF_ACCESS_AUDIENCE:}
document-assistant.access.internal-token=${APP_INTERNAL_TOKEN:}
spring.datasource.hikari.maximum-pool-size=5

# All OpenAI-compatible model calls go through OpenRouter
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${OPENROUTER_API_KEY}

# Enable embedding-model auto-configuration
spring.ai.model.embedding=openai

# Answer generation through OpenRouter
spring.ai.model.chat=openai
spring.ai.openai.chat.model=openrouter/free

# OpenRouter requires the provider-prefixed model identifier
spring.ai.openai.embedding.model=openai/text-embedding-3-small
spring.ai.openai.embedding.dimensions=1536

# Existing database configuration

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
# Do not add metadata to the text sent for embedding.
# Our chunk text already contains document, model, section, and page context.
spring.ai.openai.embedding.metadata-mode=NONE

# PostgreSQL vector-store configuration
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.table-name=document_chunk_vectors
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.max-document-batch-size=64
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=false

document-assistant.vector-ingestion.input-directory=data/chunked/specsheets
spring.ai.vectorstore.pgvector.table-name=document_chunk_vectors

document-assistant.retrieval.default-top-k=20
document-assistant.retrieval.max-top-k=40
document-assistant.retrieval.keyword-limit=60
document-assistant.retrieval.candidate-limit=40
document-assistant.retrieval.default-evidence-limit=30
document-assistant.retrieval.max-evidence-limit=40
document-assistant.retrieval.max-context-characters=70000
